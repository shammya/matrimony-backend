openapi: 3.1.0
info:
  title: Matrimony API
  version: 0.1.0
  description: |
    The machine-readable API contract: every route, field and error code. The frontend
    generates its TypeScript types from this file (`npm run api:types` in the frontend repo),
    so keep it exact and keep it short.

    What each feature does, which endpoints it has and which frontend feature uses them is
    described phase by phase in the backend tracker, not here:
    https://claude.ai/artifact/RzGP4ky7jbKQMoUVA2WFYw

    Rules for every route: the agency comes from the request `Host` header (an allowlisted
    hostname; `X-Forwarded-Host` is ignored), except for `/health/*`. Every response is
    `cache-control: no-store`. Errors use `{ error: { code, requestId, details? } }`.
servers:
  - url: /
tags:
  - name: Health
  - name: Tenant
  - name: Auth
  - name: Session handoff
  - name: Account
  - name: My profile
  - name: My photos

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Process liveness
      description: Public. No agency needed.
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [Health]
      summary: PostgreSQL and Redis availability
      description: Public. No agency needed.
      responses:
        '200':
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: unavailable }

  /api/v1/public/tenant:
    get:
      tags: [Tenant]
      summary: Public configuration of the agency for this hostname
      description: Public. Branding and public content only, never secrets.
      responses:
        '200':
          description: The active agency for the request hostname.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/auth/authorize:
    get:
      tags: [Auth]
      summary: Start login
      description: Public, 10 per minute. Sets the 5-minute `matrimony-challenge` cookie.
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/callback:
    get:
      tags: [Auth]
      summary: Finish login (OAuth redirect target)
      description: |
        Public, 10 per minute. Needs the challenge cookie, which is single use. Never returns
        tokens: it sets the `matrimony-session` cookie and redirects.
      responses:
        '302':
          description: |
            Success: `Location: /{locale}/auth/complete` and the session cookie is set.
            Expected failure: `Location: /{locale}/login?error=<code>` and no session.
            `{locale}` is the agency's default language (`bn` or `en`).
          headers:
            Location:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: An unexpected failure. Details are never exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/session:
    post:
      tags: [Session handoff]
      summary: Start or restore the browser session
      description: |
        Needs the session cookie and a same-origin `Origin` header, but no CSRF header: this
        call issues the CSRF token. A concurrent duplicate returns 409 REFRESH_UNAVAILABLE.
      responses:
        '200':
          description: A fresh token set for this session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another refresh is running. Retry after it finishes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the access token
      description: |
        Needs the session cookie, a same-origin `Origin` header and `X-CSRF-Token`. 409
        REFRESH_UNAVAILABLE means another refresh is running; any other failure means log in again.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: A new token set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another refresh is running. Retry after it finishes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      description: Same protection as refresh. Takes effect immediately.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Logged out. }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me:
    get:
      tags: [Account]
      summary: The signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current tenant-local account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Self' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me/profile:
    get:
      tags: [My profile]
      summary: The member's own profile and review state
      description: Members only. `profile` is null until the first save.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile, the waiting review and the last decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    put:
      tags: [My profile]
      summary: Save the draft
      description: Creates the profile on the first save. Only a draft or rejected profile can be saved; a rejected one becomes a draft again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: The saved state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_EDIT_REQUIRES_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/submit:
    post:
      tags: [My profile]
      summary: Send the draft for review
      description: 'Needs every required field: full name, date of birth, gender, marital status, height, religion, current district, highest degree, occupation and phone.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSubmit' }
      responses:
        '200':
          description: The profile is now pending review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PROFILE_INCOMPLETE, with details.fields listing what is missing.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/edit-requests:
    post:
      tags: [My profile]
      summary: Ask for changes to a published profile
      description: The published profile stays as it is until a reviewer approves. Only the fields that differ are recorded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: The state with a waiting field update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'NO_CHANGES or PROFILE_INCOMPLETE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/pending-review:
    delete:
      tags: [My profile]
      summary: Withdraw the waiting review
      description: A first submission goes back to being an editable draft; a change request is dropped.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The state after withdrawing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND or NO_PENDING_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }

  /api/v1/me/profile/photos:
    get:
      tags: [My photos]
      summary: The member's own photos
      description: Members only. Empty until the first upload. The profile need not exist yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The photos, in upload order, and the limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [My photos]
      summary: Upload a photo
      description: |
        The request body is the picture itself, not a form. Send it with its own content type
        (image/jpeg, image/png or image/webp), at most 5 MB. The server checks the real file type,
        removes location and camera details, and stores two WebP sizes. The photo starts as
        waiting for review and is shown to nobody else until approved. Needs a saved profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: The photos, now including the new one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND: save the profile first.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PHOTO_LIMIT_REACHED, or PROFILE_STATE_INVALID for a closed profile.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '413':
          {
            description: 'PAYLOAD_TOO_LARGE: over 5 MB.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '415':
          {
            description: 'UNSUPPORTED_MEDIA_TYPE or PHOTO_TYPE_UNSUPPORTED (for example GIF or SVG).',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PHOTO_INVALID (not a readable picture) or PHOTO_TOO_SMALL (shortest side under 200 px).',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}:
    delete:
      tags: [My photos]
      summary: Remove a photo
      description: Immediate, whatever the photo's state. A review still waiting on it is cancelled, and if it was the main photo the next approved one takes its place.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The photos that remain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}/primary:
    put:
      tags: [My photos]
      summary: Choose the main photo
      description: Only an approved photo can be the main one. The previous main photo stops being it.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The photos, with the new main photo marked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PHOTO_NOT_APPROVED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}/image:
    get:
      tags: [My photos]
      summary: The picture of one of the member's own photos
      description: |
        Returns the image itself (WebP), so the frontend requests it with the access token and
        shows it from the response; an image tag cannot send the token. A member can see their
        own waiting photos. Files are never public.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: size,
            in: query,
            schema: { type: string, enum: [thumb, full], default: full },
            description: 'thumb is 400 px on the longest side, full is up to 1600 px.',
          }
      responses:
        '200':
          description: The picture.
          content:
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provider-issued JWT access token. Keep it in memory only.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrfToken` from the last token response (43 URL-safe characters).
      schema: { type: string }

  schemas:
    Tenant:
      type: object
      required: [id, name, locale, content]
      properties:
        id: { type: string }
        name: { type: string }
        locale: { type: string, enum: [bn, en] }
        content: { $ref: '#/components/schemas/PublicConfig' }

    LocalizedText:
      type: object
      description: Text in one or both languages. A reader sees their own language, else the other.
      properties:
        bn: { type: string, maxLength: 2000 }
        en: { type: string, maxLength: 2000 }

    PublicConfig:
      type: object
      description: The agency's non-secret public settings. Every field is optional; unknown fields are ignored.
      properties:
        name:
          type: string
          description: Display name of the agency. Falls back to the agency's `name`.
        branding:
          type: object
          properties:
            logoUrl:
              type: string
              description: An `https://` URL or a path starting with `/`. Anything else is ignored.
            primaryColor:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              description: Main brand color as `#RRGGBB`. It reaches CSS, so nothing else is accepted.
        contact:
          type: object
          properties:
            phone: { type: string, maxLength: 40 }
            email: { type: string, maxLength: 200 }
        home:
          type: object
          description: Optional homepage copy that replaces the platform's default wording.
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            subtitle: { $ref: '#/components/schemas/LocalizedText' }
        about: { $ref: '#/components/schemas/LocalizedText' }
        branches:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Branch' }
        successStories:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/SuccessStory' }

    Branch:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        address: { $ref: '#/components/schemas/LocalizedText' }
        phone: { type: string, maxLength: 40 }
        mapUrl:
          type: string
          description: An `https://` link to the location on a map. Anything else is ignored.

    SuccessStory:
      type: object
      required: [names]
      description: Only stories the couple has agreed to publish belong here.
      properties:
        names: { $ref: '#/components/schemas/LocalizedText' }
        story: { $ref: '#/components/schemas/LocalizedText' }
        year: { type: integer, minimum: 1900, maximum: 2100 }

    Self:
      type: object
      required: [id, agencyId, role, displayName]
      properties:
        id: { type: string }
        agencyId: { type: string }
        role: { type: string, enum: [admin, agent, member] }
        displayName: { type: string }

    Tokens:
      type: object
      required: [accessToken, csrfToken, expiresIn]
      properties:
        accessToken: { type: string }
        csrfToken: { type: string }
        expiresIn: { type: integer, description: Seconds until the access token expires. }

    Gender:
      type: string
      enum: [male, female]
    MaritalStatus:
      type: string
      enum: [never_married, divorced, widowed]
    Complexion:
      type: string
      enum: [very_fair, fair, medium, olive, dark]
    BloodGroup:
      type: string
      enum: [a_pos, a_neg, b_pos, b_neg, ab_pos, ab_neg, o_pos, o_neg]
    Religion:
      type: string
      enum: [islam, hinduism, buddhism, christianity, other]
    Sect:
      type: string
      enum: [sunni, shia, other]
    EducationLevel:
      type: string
      description: Lowest to highest.
      enum: [ssc, hsc, diploma, bachelors, masters, phd]
    Degree:
      type: string
      enum: [ssc, hsc, diploma, bachelors, masters, phd, other]
    Occupation:
      type: string
      enum: [salaried, business, self_employed, student, homemaker, unemployed, other]
    IncomeBand:
      type: string
      description: Lowest to highest.
      enum: [below_20k, 20k_50k, 50k_100k, 100k_200k, above_200k]
    FamilyStatus:
      type: string
      description: Lowest to highest.
      enum: [lower, lower_middle, middle, upper_middle, upper]
    ReligiousPractice:
      type: string
      enum: [practicing, moderate, non_practicing]
    DietaryPreference:
      type: string
      enum: [no_restriction, halal_only, vegetarian, other]
    ManagedFor:
      type: string
      enum: [self, child, sibling, relative, other]
    District:
      type: string
      description: One of the 64 districts of Bangladesh.
      enum:
        [
          barguna,
          barishal,
          bhola,
          jhalokati,
          patuakhali,
          pirojpur,
          bandarban,
          brahmanbaria,
          chandpur,
          chattogram,
          coxs_bazar,
          cumilla,
          feni,
          khagrachhari,
          lakshmipur,
          noakhali,
          rangamati,
          dhaka,
          faridpur,
          gazipur,
          gopalganj,
          kishoreganj,
          madaripur,
          manikganj,
          munshiganj,
          narayanganj,
          narsingdi,
          rajbari,
          shariatpur,
          tangail,
          bagerhat,
          chuadanga,
          jashore,
          jhenaidah,
          khulna,
          kushtia,
          magura,
          meherpur,
          narail,
          satkhira,
          jamalpur,
          mymensingh,
          netrokona,
          sherpur,
          bogura,
          chapainawabganj,
          joypurhat,
          naogaon,
          natore,
          pabna,
          rajshahi,
          sirajganj,
          dinajpur,
          gaibandha,
          kurigram,
          lalmonirhat,
          nilphamari,
          panchagarh,
          rangpur,
          thakurgaon,
          habiganj,
          moulvibazar,
          sunamganj,
          sylhet,
        ]

    ProfileStatus:
      type: string
      enum: [draft, pending_review, rejected, active, paused, matched, closed]
    ProfileContent:
      type: object
      additionalProperties: false
      description: |
        Biodata. Every field may be omitted or null in a request (a draft can be partial); a
        response always contains every field. An empty string counts as null.
      properties:
        managedFor: { $ref: '#/components/schemas/ManagedFor' }
        fullName: { type: string, minLength: 1, maxLength: 100 }
        dateOfBirth:
          {
            type: [string, 'null'],
            format: date,
            description: 'YYYY-MM-DD. The member must be 18 to 100 years old.',
          }
        gender: { anyOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        maritalStatus: { anyOf: [{ $ref: '#/components/schemas/MaritalStatus' }, { type: 'null' }] }
        heightCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        weightKg: { type: [integer, 'null'], minimum: 20, maximum: 300 }
        complexionCode: { anyOf: [{ $ref: '#/components/schemas/Complexion' }, { type: 'null' }] }
        bloodGroup: { anyOf: [{ $ref: '#/components/schemas/BloodGroup' }, { type: 'null' }] }
        nationalityCode:
          { type: string, pattern: '^[A-Z]{2}$', description: ISO country code. BD when omitted. }
        religionCode: { anyOf: [{ $ref: '#/components/schemas/Religion' }, { type: 'null' }] }
        sectCode: { anyOf: [{ $ref: '#/components/schemas/Sect' }, { type: 'null' }] }
        currentCity: { type: [string, 'null'], maxLength: 100 }
        currentDistrictCode:
          { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        originDistrictCode: { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        highestDegreeCode: { anyOf: [{ $ref: '#/components/schemas/Degree' }, { type: 'null' }] }
        institutionName: { type: [string, 'null'], maxLength: 150 }
        fieldOfStudy: { type: [string, 'null'], maxLength: 100 }
        graduationYear: { type: [integer, 'null'], minimum: 1950, maximum: 2100 }
        occupationCode: { anyOf: [{ $ref: '#/components/schemas/Occupation' }, { type: 'null' }] }
        jobTitle: { type: [string, 'null'], maxLength: 100 }
        employerName: { type: [string, 'null'], maxLength: 150 }
        monthlyIncomeBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        fatherName: { type: [string, 'null'], maxLength: 100 }
        fatherOccupation: { type: [string, 'null'], maxLength: 100 }
        motherName: { type: [string, 'null'], maxLength: 100 }
        motherOccupation: { type: [string, 'null'], maxLength: 100 }
        siblingCount: { type: [integer, 'null'], minimum: 0, maximum: 30 }
        familyStatusCode:
          { anyOf: [{ $ref: '#/components/schemas/FamilyStatus' }, { type: 'null' }] }
        religiousPracticeCode:
          { anyOf: [{ $ref: '#/components/schemas/ReligiousPractice' }, { type: 'null' }] }
        dietaryPreferenceCode:
          { anyOf: [{ $ref: '#/components/schemas/DietaryPreference' }, { type: 'null' }] }
        hobbies: { type: [string, 'null'], maxLength: 500 }
        aboutMe: { type: [string, 'null'], maxLength: 2000 }

    ContactDetails:
      type: object
      additionalProperties: false
      description: Private contact details. Never shown to other members.
      properties:
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactRelationship: { type: [string, 'null'], maxLength: 50 }
        phone:
          {
            type: [string, 'null'],
            pattern: "^\\+[1-9][0-9]{7,14}$",
            description: 'E.164, for example +8801712345678.',
          }
        email: { type: [string, 'null'], format: email, maxLength: 200 }
        permanentAddress: { type: [string, 'null'], maxLength: 300 }

    PartnerPreferences:
      type: object
      additionalProperties: false
      description: Lists are empty when the member has no preference. Ranges may not be reversed.
      properties:
        ageMin: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        ageMax: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        heightMinCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        heightMaxCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        religionCodes: { type: array, items: { $ref: '#/components/schemas/Religion' } }
        sectCodes: { type: array, items: { $ref: '#/components/schemas/Sect' } }
        maritalStatusCodes: { type: array, items: { $ref: '#/components/schemas/MaritalStatus' } }
        educationMinCode:
          { anyOf: [{ $ref: '#/components/schemas/EducationLevel' }, { type: 'null' }] }
        occupationCodes: { type: array, items: { $ref: '#/components/schemas/Occupation' } }
        districtCodes: { type: array, items: { $ref: '#/components/schemas/District' } }
        incomeMinBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        incomeMaxBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        familyStatusMinCode:
          { anyOf: [{ $ref: '#/components/schemas/FamilyStatus' }, { type: 'null' }] }

    ProfileData:
      type: object
      additionalProperties: false
      properties:
        profile: { $ref: '#/components/schemas/ProfileContent' }
        contact: { $ref: '#/components/schemas/ContactDetails' }
        preferences: { $ref: '#/components/schemas/PartnerPreferences' }
    ProfileInput:
      type: object
      additionalProperties: false
      required: [profile]
      description: |
        The whole editable content, replacing what was there. Owner, agency, status, member code
        and the profile version can never be set by the client other than as the version last seen.
      properties:
        version:
          type: integer
          minimum: 1
          description: The profile version last seen. Omit only on the very first save.
        profile: { $ref: '#/components/schemas/ProfileContent' }
        contact: { $ref: '#/components/schemas/ContactDetails' }
        preferences: { $ref: '#/components/schemas/PartnerPreferences' }
    OwnProfile:
      type: object
      required: [id, memberCode, status, version, currentDivisionCode, createdAt, updatedAt, data]
      properties:
        id: { type: string, format: uuid }
        memberCode: { type: string, description: 'For example M0483921.' }
        status: { $ref: '#/components/schemas/ProfileStatus' }
        version: { type: integer, description: Rises on every change. }
        currentDivisionCode: { type: [string, 'null'], description: Worked out from the district. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/ProfileData' }
    ProposedChanges:
      type: object
      additionalProperties: false
      description: Only the fields that differ from the published profile.
      properties:
        profile: { type: object, additionalProperties: true }
        contact: { type: object, additionalProperties: true }
        preferences: { type: object, additionalProperties: true }
    ProfileReview:
      type: object
      required:
        [
          id,
          kind,
          status,
          baseProfileVersion,
          proposedChanges,
          reviewerNotes,
          reviewedAt,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [initial_submission, field_update] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        baseProfileVersion: { type: [integer, 'null'] }
        proposedChanges:
          description: For an initial submission, the whole content; for a field update, only what differs.
          anyOf:
            [
              { $ref: '#/components/schemas/ProposedChanges' },
              { $ref: '#/components/schemas/ProfileData' },
              { type: 'null' },
            ]
        reviewerNotes: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    OwnProfileState:
      type: object
      required: [profile, pendingReview, lastDecision]
      properties:
        profile: { anyOf: [{ $ref: '#/components/schemas/OwnProfile' }, { type: 'null' }] }
        pendingReview: { anyOf: [{ $ref: '#/components/schemas/ProfileReview' }, { type: 'null' }] }
        lastDecision:
          description: The most recent approval or rejection, including the reviewer's note.
          anyOf: [{ $ref: '#/components/schemas/ProfileReview' }, { type: 'null' }]
    ProfileSubmit:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }

    PhotoState:
      type: string
      enum: [waiting, approved, rejected]
      description: Waiting for a reviewer, approved (shown to others) or rejected.
    Photo:
      type: object
      required: [id, state, isPrimary, createdAt, reviewerNotes]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PhotoState' }
        isPrimary:
          { type: boolean, description: The photo shown first. Only an approved photo can be it. }
        createdAt: { type: string, format: date-time }
        reviewerNotes:
          { type: [string, 'null'], description: The reviewer's note when the photo was rejected. }
    PhotoList:
      type: object
      required: [photos, limit]
      properties:
        photos:
          type: array
          description: In the order the member uploaded them. Removed photos are not listed.
          items: { $ref: '#/components/schemas/Photo' }
        limit: { type: integer, description: How many photos a member may have at once. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, requestId]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code. Known codes: HOST_INVALID, TENANT_NOT_FOUND,
                BEARER_TOKEN_REQUIRED, INVALID_ACCESS_TOKEN, SESSION_INVALID, SESSION_EXPIRED,
                ACCOUNT_NOT_ACTIVE, ROLE_FORBIDDEN, ORIGIN_INVALID, CSRF_INVALID,
                OAUTH_CHALLENGE_EXPIRED, OAUTH_CONTEXT_MISMATCH, OAUTH_EXCHANGE_FAILED,
                OAUTH_SUBJECT_MISMATCH, REFRESH_UNAVAILABLE, REFRESH_FAILED_LOGIN_REQUIRED,
                INVALID_REQUEST, RATE_LIMITED, REQUEST_REJECTED, INTERNAL_ERROR, and for My profile:
                PROFILE_NOT_FOUND, PROFILE_VERSION_CONFLICT, PROFILE_LOCKED,
                PROFILE_EDIT_REQUIRES_REVIEW, PROFILE_STATE_INVALID, PROFILE_INCOMPLETE,
                NO_PENDING_REVIEW, NO_CHANGES, MEMBER_CODE_UNAVAILABLE, and for photos:
                PHOTO_NOT_FOUND, PHOTO_LIMIT_REACHED, PHOTO_NOT_APPROVED, PHOTO_INVALID,
                PHOTO_TYPE_UNSUPPORTED, PHOTO_TOO_SMALL, PAYLOAD_TOO_LARGE,
                UNSUPPORTED_MEDIA_TYPE.
            details:
              type: object
              description: |
                Present on INVALID_REQUEST and PROFILE_INCOMPLETE. Each problem names a field by its
                dotted path (for example `profile.dateOfBirth`) and a stable code the client
                translates: required, tooLong, invalid, invalidOption, invalidDate, underAge,
                tooOld, outOfRange, invalidPhone, invalidEmail, rangeOrder. Values are never echoed back.
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [path, code]
                    properties:
                      path: { type: string }
                      code: { type: string }
            requestId: { type: string, description: Quote this when reporting a problem. }

  responses:
    Error400:
      description: Invalid host or request (HOST_INVALID, INVALID_REQUEST).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: Not authenticated or session invalid. Sends `WWW-Authenticate Bearer`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: Forbidden (ROLE_FORBIDDEN, ACCOUNT_NOT_ACTIVE, ORIGIN_INVALID, CSRF_INVALID).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TenantNotFound:
      description: The hostname is not a provisioned, active agency (TENANT_NOT_FOUND).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests (RATE_LIMITED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
