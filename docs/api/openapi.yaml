openapi: 3.1.0
info:
  title: Matrimony API
  version: 0.1.0
  description: |
    The machine-readable API contract: every route, field and error code. The frontend
    generates its TypeScript types from this file (`npm run api:types` in the frontend repo),
    so keep it exact and keep it short.

    What each feature does, which endpoints it has and which frontend feature uses them is
    described phase by phase in the backend tracker, not here:
    https://claude.ai/artifact/RzGP4ky7jbKQMoUVA2WFYw

    Rules for every route: the agency comes from the request `Host` header (an allowlisted
    hostname; `X-Forwarded-Host` is ignored), except for `/health/*`. Every response is
    `cache-control: no-store`. Errors use `{ error: { code, requestId, details? } }`.
servers:
  - url: /
tags:
  - name: Health
  - name: Tenant
  - name: Auth
  - name: Registration
  - name: Session handoff
  - name: Account
  - name: My profile
  - name: My photos
  - name: Review queue
  - name: Clients

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Process liveness
      description: Public. No agency needed.
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [Health]
      summary: PostgreSQL and Redis availability
      description: Public. No agency needed.
      responses:
        '200':
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: unavailable }

  /api/v1/public/tenant:
    get:
      tags: [Tenant]
      summary: Public configuration of the agency for this hostname
      description: Public. Branding and public content only, never secrets.
      responses:
        '200':
          description: The active agency for the request hostname.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/auth/register:
    post:
      tags: [Registration]
      summary: Start registering as a member
      description: |
        Public, 10 per 10 minutes per client address, same-origin only. Nothing is created yet: a
        link is emailed, and the account exists once it is opened (`/auth/verify-email`). The
        answer is always 202, whether or not the email already has an account, because that
        itself is private; an address that has an account is emailed a notice instead of a link.
        One address can be sent 3 such emails an hour (429 `EMAIL_RATE_LIMITED`, with
        `details.retryAfter` and a `Retry-After` header). Asking again cancels the earlier link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '202':
          description: The link was sent, or the address already has an account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/verify-email:
    post:
      tags: [Registration]
      summary: Open the emailed link, which proves the address, creates the account and signs in
      description: |
        Public, 10 per minute, same-origin only. The link works once, for 24 hours, and only at
        the agency that sent it. The account, its password, the consents and an event are written
        together, and a session starts exactly like a login (the cookie is set and the tokens are
        returned). Only the request that creates the account gets a session: an address that
        already has one (another route, another link) is refused like a used link. A used, expired
        or unknown link is 400 `LINK_INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: The account exists and the person is signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/email/confirm:
    post:
      tags: [Auth]
      summary: Open the emailed link that adds an email to an account
      description: |
        Step three. Public, 10 per minute, same-origin only. Needs no session, because the link may
        be opened on another device, and it signs nobody in. The link works once, for 1 hour, and
        only at the agency that sent it. It adds the address, marked as verified, to the account
        that asked, only if that account still has no email and nobody else has taken the address:
        409 `EMAIL_IN_USE` or 409 `EMAIL_ALREADY_SET` otherwise. A used, expired or unknown link
        is 400 `LINK_INVALID_OR_EXPIRED`. Records `auth.email_added`. A password can then be set
        with the usual forgot-password link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: The address was added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: EMAIL_IN_USE or EMAIL_ALREADY_SET.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email or phone number, and a password
      description: |
        Public, 10 per minute per client address, same-origin only. Starts a session: the
        `matrimony-session` cookie (HttpOnly, SameSite=Strict, `__Host-` and Secure in production)
        is set, and the tokens come back in the body for the page to keep in memory. After five
        wrong passwords for one email, sign-in for that email pauses for 15 minutes, even for the
        right password (429 `TOO_MANY_ATTEMPTS`, with `details.retryAfter` and a `Retry-After`
        header). An unknown email, an account with no password and a wrong password are all the
        same 401 `INVALID_CREDENTIALS`. A disabled account is told so (403 `ACCOUNT_NOT_ACTIVE`)
        only after the right password. Send **either** `email` **or** `phone` (a number that a code
        has proved belongs to an account), never both: the same rules, the same answers and the
        same pause apply to a phone number, counted separately from the email. No text message is
        sent, and none is paid for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: |
        Public, 10 per 10 minutes per client address, same-origin only. Always 202, whether or not
        the email has an active account. The link works once, for 1 hour. One address can be sent
        3 reset emails an hour (429 `EMAIL_RATE_LIMITED`). Asking again cancels the earlier link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordInput' }
      responses:
        '202':
          description: A link was sent if the email has an account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Choose a new password with the emailed link
      description: |
        Public, 10 per 10 minutes per client address, same-origin only. Sets the password, ends
        every session of the account, records `auth.password_reset` and emails the owner a notice.
        A password that breaks the rules is a 400 with field problems and does not use up the
        link. A used, expired or unknown link is 400 `LINK_INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '200':
          description: The password was changed. Sign in with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/methods:
    get:
      tags: [Auth]
      summary: Which ways of signing in are on
      description: |
        Public. The pages use it to show only buttons that work. `google` is false until the
        Google client id and secret are configured.
      responses:
        '200':
          description: The sign-in methods offered by this deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMethods' }
        '404': { $ref: '#/components/responses/TenantNotFound' }

  /api/v1/auth/google/start:
    post:
      tags: [Auth]
      summary: Start signing in or registering with Google
      description: |
        Public, 10 per minute per client address, same-origin only. Registering needs the same
        agreements as an email registration, checked here before the person leaves. Nothing is
        created yet. Sets the 5-minute single-use `matrimony-challenge` cookie (HttpOnly, Lax,
        because Google sends the browser back from another site) and returns Google's address,
        which carries PKCE, state and nonce. 404 `GOOGLE_NOT_CONFIGURED` when Google is off;
        502 `GOOGLE_UNAVAILABLE` when Google cannot be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleStartInput' }
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationUrl' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/callback:
    get:
      tags: [Auth]
      summary: Where Google sends the browser back
      description: |
        Public, 10 per minute. Needs the attempt cookie, which is single use. Never returns
        tokens. The identity must come with an email Google has confirmed.
        An identity already linked signs in. Otherwise, an email that already has an account is
        never linked on the email alone: the browser goes to `/{locale}/link-google` to give that
        account's password (see `/auth/google/link`). Otherwise a registration creates a member
        (no password). A login that finds no account creates nothing: the browser goes to
        `/{locale}/signup-google` to agree to the terms first (see `/auth/google/signup`).
      responses:
        '302':
          description: |
            Signed in: `Location: /{locale}/dashboard` and the `matrimony-session` cookie is set.
            Needs the account's password: `Location: /{locale}/link-google` and the strict
            `matrimony-link` cookie is set (10 minutes). No account yet:
            `Location: /{locale}/signup-google` and the strict `matrimony-signup` cookie is set
            (10 minutes). Failure:
            `Location: /{locale}/login?error=<code>` with GOOGLE_AUTH_FAILED,
            GOOGLE_EMAIL_UNVERIFIED, ACCOUNT_HAS_NO_PASSWORD, ACCOUNT_NOT_ACTIVE,
            OAUTH_CHALLENGE_EXPIRED, OAUTH_CONTEXT_MISMATCH, GOOGLE_RETRY, INVALID_REQUEST or
            GOOGLE_NOT_CONFIGURED. `{locale}` is the language the person was reading.
          headers:
            Location:
              schema: { type: string }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/pending:
    get:
      tags: [Auth]
      summary: Whose account is waiting for its password
      description: |
        Public, 20 per minute. Needs the `matrimony-link` cookie. Returns the email of the account
        the Google sign-in is waiting to be linked to, so the page can ask for its password.
        400 `LINK_INVALID_OR_EXPIRED` when there is none.
      responses:
        '200':
          description: The account waiting to be linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingGoogleLink' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/signup:
    get:
      tags: [Auth]
      summary: Who Google says is signing up
      description: |
        Public, 20 per minute. Needs the `matrimony-signup` cookie. Returns the email and name
        Google vouched for, so the page can ask the person to agree to the terms before an account
        is created. 400 `LINK_INVALID_OR_EXPIRED` when there is none.
      responses:
        '200':
          description: The Google person waiting to agree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingGoogleSignup' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Auth]
      summary: Agree to the terms, create the account, and sign in
      description: |
        Public, 10 per minute, same-origin only. Needs the `matrimony-signup` cookie. The account
        is created as a member (no password) from the name and email Google vouched for, never from
        the request, with the consents and the registration event, and a session starts exactly like
        a login. Missing agreements are 400 with the field code `required` and leave the step open;
        any other outcome ends it. 409 `GOOGLE_RETRY` when an account for the address appeared in
        the meantime (Google sign-in will then find it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignupInput' }
      responses:
        '200':
          description: Account created and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: An account for the address appeared meanwhile (GOOGLE_RETRY).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/google/link:
    post:
      tags: [Auth]
      summary: Link Google to the account with its password, and sign in
      description: |
        Public, 10 per minute, same-origin only. Needs the `matrimony-link` cookie. The password
        is checked like at sign-in, and a wrong one counts toward the same pause (429
        `TOO_MANY_ATTEMPTS`). A wrong password leaves the step open to retry; success links Google,
        records `auth.identity_linked`, ends the step and starts a session exactly like a login.
        409 `GOOGLE_ALREADY_LINKED` when the account already has a Google identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleLinkInput' }
      responses:
        '200':
          description: Linked and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/phone/start:
    post:
      tags: [Auth]
      summary: Send a code to sign in or register with a phone number
      description: |
        Public, 10 per 10 minutes by address, same-origin only. Sends a six-digit code by text
        message to the number. It answers and sends the same whether or not the number has an
        account, and one request serves both signing in and registering. A code works once, for 5
        minutes, and asking again replaces it. A number can be sent one code a minute and 5 an hour,
        and an agency 2000 a day: 429 `CODE_RATE_LIMITED` with `Retry-After`. 502
        `SMS_UNAVAILABLE` when the gateway does not accept the message, 404
        `PHONE_NOT_CONFIGURED` when no sender is set up. Numbers are stored as E.164; Bangladeshi
        mobile numbers may be written `01712345678`, `8801712345678` or `+8801712345678`, and
        Bengali digits are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneStartInput' }
      responses:
        '202':
          description: A code was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSent' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/phone/verify:
    post:
      tags: [Auth]
      summary: Check the code
      description: |
        Public, 10 per minute by address, same-origin only. A right code uses the code up. When the
        number belongs to an account, 200 signs the person in exactly like a login (the cookie is
        set and the tokens are returned); a disabled account is 403 `ACCOUNT_NOT_ACTIVE`. When it
        has no account, nothing is created: 202 with the strict `matrimony-signup` cookie (10
        minutes) and the person finishes on `/{locale}/signup-phone` (see `/auth/phone/signup`). A
        wrong code is 400 `CODE_INVALID` and can be tried again; five wrong ones, a used or an
        expired code are 400 `CODE_EXPIRED` and a new code must be asked for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneVerifyInput' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '202':
          description: The number is proven but has no account yet. The person must agree to the terms.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/phone/signup:
    get:
      tags: [Auth]
      summary: The number waiting to finish registering
      description: |
        Public, 20 per minute. Needs the `matrimony-signup` cookie. Returns the number the code
        proved, so the page can ask for the name and the agreement to the terms. 400
        `LINK_INVALID_OR_EXPIRED` when there is none.
      responses:
        '200':
          description: The proven number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingPhoneSignup' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Auth]
      summary: Give a name, agree to the terms, create the account, and sign in
      description: |
        Public, 10 per minute, same-origin only. Needs the `matrimony-signup` cookie. The account
        is created as a member (no email, no password) with the number the code proved, never one
        from the request, with the consents and the registration event, and a session starts exactly
        like a login. Missing agreements are 400 with the field code `required`. The step is used
        up at once, so a double press cannot create two accounts. 409 `PHONE_RETRY` when an account
        for the number appeared in the meantime (the number will then sign in).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneSignupInput' }
      responses:
        '200':
          description: Account created and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: An account for the number appeared meanwhile (PHONE_RETRY).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/session:
    post:
      tags: [Session]
      summary: Restore the browser session
      description: |
        For a reload or a new tab: the session cookie alone brings back a working token set. Needs
        the session cookie and a same-origin `Origin` header, but no CSRF header: this call returns
        the CSRF token. A concurrent duplicate returns 409 REFRESH_UNAVAILABLE.
      responses:
        '200':
          description: A fresh token set for this session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another refresh is running. Retry after it finishes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the access token
      description: |
        Needs the session cookie, a same-origin `Origin` header and `X-CSRF-Token`. 409
        REFRESH_UNAVAILABLE means another refresh is running; any other failure means log in again.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: A new token set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another refresh is running. Retry after it finishes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      description: Same protection as refresh. Takes effect immediately.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '204': { description: Logged out. }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me:
    get:
      tags: [Account]
      summary: The signed-in account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current tenant-local account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Self' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me/sign-in-methods:
    get:
      tags: [Account]
      summary: What the signed-in account can sign in with
      description: |
        For the account settings. The phone number is partly hidden (`+8801••••••678`). An account
        may have no email (it registered with a phone), no password (it registered with Google or a
        phone), or no phone.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The sign-in methods of the account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInMethods' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/me/phone/start:
    post:
      tags: [Account]
      summary: Send a code to a number to add or change to
      description: |
        10 per 10 minutes. Same answer and same limits as `/auth/phone/start`, whether or not
        another account has the number. The code belongs to this account: it cannot be used to sign
        in, and a code sent for another account cannot be used here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneStartInput' }
      responses:
        '202':
          description: A code was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSent' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/phone/verify:
    post:
      tags: [Account]
      summary: Check the code and make the number this account's own
      description: |
        10 per minute. A right code adds the number (replacing an earlier one) and records
        `auth.phone_added`; from then on the number signs in to this account. 409 `PHONE_IN_USE`
        when another account already has the number (the person proved they hold it, so this
        reveals nothing they lack). Wrong and old codes are 400 `CODE_INVALID` and `CODE_EXPIRED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneAttachInput' }
      responses:
        '200':
          description: The number was added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          description: Another account already has this number (PHONE_IN_USE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/reauth/start:
    post:
      tags: [Account]
      summary: Send a code to the account's own phone, to prove it is the owner
      description: |
        Step one of adding an email to a phone-only account, and of choosing a new password with a
        code (`/me/password`). 10 per 10 minutes. The code goes to the
        number the account already has, never to one from the request, and it belongs to this
        purpose: it cannot sign anyone in, and a sign-in code cannot be used for it. Same limits as
        other codes (one a minute and 5 an hour per number). 409 `PHONE_REQUIRED` when the account has
        no verified phone, 404 `PHONE_NOT_CONFIGURED` when no sender is set up.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthStartInput' }
      responses:
        '202':
          description: A code was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSent' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: EMAIL_ALREADY_SET or PHONE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/password:
    post:
      tags: [Account]
      summary: Choose a new password, with a code sent to the account's own phone
      description: |
        For an account that has a verified phone, including a member who registered with a phone
        and forgot the password and may have no email. 10 per 10 minutes. Needs the code from
        `/me/reauth/start` (400 `CODE_INVALID` to try again, 400 `CODE_EXPIRED` after five wrong
        ones or an old one), so a stolen session alone cannot do it. The new password follows the
        usual rules and may not be the email or the phone number (400 with the field problem
        `sameAsEmail` or `sameAsPhone`; the code is not spent). It ends **every** session of the
        account, this one included, like any password reset: the person logs in again. The owner is
        told by email when the account has one. Records `auth.password_reset`. 409
        `PHONE_REQUIRED` without a verified phone.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '200':
          description: The password was changed and every session ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: PHONE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/email/start:
    post:
      tags: [Account]
      summary: Send a link to an address to add it to the account
      description: |
        Step two. 10 per 10 minutes. With the right code from `/me/reauth/start` (a wrong one is
        400 `CODE_INVALID`, five wrong ones or an old one 400 `CODE_EXPIRED`), a link that works
        once for 1 hour is emailed to the address. Nothing is added until the link is opened. The
        answer is the same whether or not the address already belongs to an account: that account's
        owner gets a notice instead of a link. Asking again cancels the earlier link. An address is
        sent 3 of these emails an hour (429 `EMAIL_RATE_LIMITED`). An existing email is never
        replaced.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddEmailStartInput' }
      responses:
        '202':
          description: The link was sent, or the address is in use and its owner was told.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409':
          description: EMAIL_ALREADY_SET or PHONE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/profile:
    get:
      tags: [My profile]
      summary: The member's own profile and review state
      description: Members only. `profile` is null until the first save.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile, the waiting review and the last decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    put:
      tags: [My profile]
      summary: Save the draft
      description: Creates the profile on the first save. Only a draft or rejected profile can be saved; a rejected one becomes a draft again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: The saved state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_EDIT_REQUIRES_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/submit:
    post:
      tags: [My profile]
      summary: Send the draft for review
      description: 'Needs every required field: full name, date of birth, gender, marital status, height, religion, current district, highest degree, occupation and phone.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSubmit' }
      responses:
        '200':
          description: The profile is now pending review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PROFILE_INCOMPLETE, with details.fields listing what is missing.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/edit-requests:
    post:
      tags: [My profile]
      summary: Ask for changes to a published profile
      description: The published profile stays as it is until a reviewer approves. Only the fields that differ are recorded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: The state with a waiting field update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'NO_CHANGES or PROFILE_INCOMPLETE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/pending-review:
    delete:
      tags: [My profile]
      summary: Withdraw the waiting review
      description: A first submission goes back to being an editable draft; a change request is dropped.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The state after withdrawing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfileState' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND or NO_PENDING_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }

  /api/v1/me/profile/photos:
    get:
      tags: [My photos]
      summary: The member's own photos
      description: Members only. Empty until the first upload. The profile need not exist yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The photos, in upload order, and the limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [My photos]
      summary: Upload a photo
      description: |
        The request body is the picture itself, not a form. Send it with its own content type
        (image/jpeg, image/png or image/webp), at most 5 MB. The server checks the real file type,
        removes location and camera details, and stores two WebP sizes. The photo starts as
        waiting for review and is shown to nobody else until approved. Needs a saved profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: The photos, now including the new one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND: save the profile first.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PHOTO_LIMIT_REACHED, or PROFILE_STATE_INVALID for a closed profile.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '413':
          {
            description: 'PAYLOAD_TOO_LARGE: over 5 MB.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '415':
          {
            description: 'UNSUPPORTED_MEDIA_TYPE or PHOTO_TYPE_UNSUPPORTED (for example GIF or SVG).',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PHOTO_INVALID (not a readable picture) or PHOTO_TOO_SMALL (shortest side under 200 px).',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}:
    delete:
      tags: [My photos]
      summary: Remove a photo
      description: Immediate, whatever the photo's state. A review still waiting on it is cancelled, and if it was the main photo the next approved one takes its place.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The photos that remain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}/primary:
    put:
      tags: [My photos]
      summary: Choose the main photo
      description: Only an approved photo can be the main one. The previous main photo stops being it.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The photos, with the new main photo marked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PHOTO_NOT_APPROVED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/me/profile/photos/{photoId}/image:
    get:
      tags: [My photos]
      summary: The picture of one of the member's own photos
      description: |
        Returns the image itself (WebP), so the frontend requests it with the access token and
        shows it from the response; an image tag cannot send the token. A member can see their
        own waiting photos. Files are never public.
      security:
        - bearerAuth: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: size,
            in: query,
            schema: { type: string, enum: [thumb, full], default: full },
            description: 'thumb is 400 px on the longest side, full is up to 1600 px.',
          }
      responses:
        '200':
          description: The picture.
          content:
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews:
    get:
      tags: [Review queue]
      summary: The approval queue
      description: |
        Admins and agents. Waiting requests are listed oldest first, decided ones newest first.
        An admin sees every request. An agent sees those for clients assigned to them and for
        profiles nobody has been assigned to yet.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/QueueStatus' },
            description: Default pending.,
          }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/QueueKind' } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: after,
            in: query,
            schema: { type: string },
            description: The `next` of the previous page.,
          }
      responses:
        '200':
          description: One page of the queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuePage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/reviews/summary:
    get:
      tags: [Review queue]
      summary: How many requests are waiting for this reviewer
      description: For the badge in the navigation. Counted the same way the queue is listed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The number waiting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSummary' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/v1/reviews/{reviewId}:
    get:
      tags: [Review queue]
      summary: One request, with what it would change
      description: |
        A first submission lists everything filled in. A change request lists each changed field
        with its published and proposed value. `canDecide` and `blockedBy` say whether this
        reviewer may decide it now. A request an agent may not see is reported as not found.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews/{reviewId}/photo:
    get:
      tags: [Review queue]
      summary: The photo a request is about
      description: The image itself (WebP), requested with the access token. Only for a photo request the reviewer may see.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: size, in: query, schema: { type: string, enum: [thumb, full], default: full } }
      responses:
        '200':
          description: The picture.
          content:
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND or PHOTO_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews/{reviewId}/approve:
    post:
      tags: [Review queue]
      summary: Approve a request
      description: |
        A first submission publishes the profile. A change request is applied to it. A photo
        becomes visible, and the main photo if there is none yet. Refused if the profile changed
        since the request was made, or since the version the reviewer saw. Nobody approves their
        own submission, except an admin.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveInput' }
      responses:
        '200':
          description: The request, now approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'REVIEW_ALREADY_DECIDED, REVIEW_CANCELLED, REVIEW_OUT_OF_DATE or REVIEW_OWN_SUBMISSION.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PROFILE_INCOMPLETE: applying it would leave a required field empty.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/reviews/{reviewId}/reject:
    post:
      tags: [Review queue]
      summary: Reject a request
      description: |
        Needs a reason, which the member sees. A rejected first submission goes back to the member
        as "needs changes". A rejected change request leaves the published profile as it was. A
        rejected photo stays with its owner, unpublished.
      security:
        - bearerAuth: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectInput' }
      responses:
        '200':
          description: The request, now rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'REVIEW_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'REVIEW_ALREADY_DECIDED, REVIEW_CANCELLED, REVIEW_OUT_OF_DATE or REVIEW_OWN_SUBMISSION.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients:
    get:
      tags: [Clients]
      summary: The clients, most recently changed first
      description: |
        An admin sees every profile of the agency; an agent only those assigned to them, whatever
        they ask for. `assignedTo` is an admin's filter.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProfileStatus' } }
        - { name: serviceMode, in: query, schema: { $ref: '#/components/schemas/ServiceMode' } }
        - {
            name: assignedTo,
            in: query,
            schema: { type: string },
            description: "Admin only: an agent's id, or none for clients nobody looks after.",
          }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Part of a name or member code.,
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: after, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of clients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Clients]
      summary: Create an assisted client
      description: |
        A draft profile for someone who has no login. It belongs to the agency, is created by this
        staff member and is assigned to an agent: an agent's client is always theirs, an admin may
        name an agent or leave it unassigned. It goes through review like any profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: The new client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '422':
          {
            description: 'AGENT_NOT_AVAILABLE: the agent is not an active admin or agent of this agency.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}:
    get:
      tags: [Clients]
      summary: A client's profile and who looks after it
      description: A profile the staff member may not manage is reported as not found.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The profile, its waiting review, and the client details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
    put:
      tags: [Clients]
      summary: Save an assisted client's draft
      description: Same rules as a member's own draft. Not for a member who runs their own profile.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: The saved state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: "PROFILE_SELF_SERVICE: staff do not edit a member's own profile.",
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_EDIT_REQUIRES_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/submit:
    post:
      tags: [Clients]
      summary: Send an assisted client's draft for review
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSubmit' }
      responses:
        '200':
          description: The profile is now pending review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: 'PROFILE_SELF_SERVICE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'PROFILE_INCOMPLETE, with details.fields listing what is missing.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/edit-requests:
    post:
      tags: [Clients]
      summary: Ask for changes to a published assisted client
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: The state with a waiting field update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: 'PROFILE_SELF_SERVICE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT, PROFILE_LOCKED or PROFILE_STATE_INVALID.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'NO_CHANGES or PROFILE_INCOMPLETE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/pending-review:
    delete:
      tags: [Clients]
      summary: Withdraw the waiting review of an assisted client
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The state after withdrawing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403':
          {
            description: 'PROFILE_SELF_SERVICE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '404':
          {
            description: 'PROFILE_NOT_FOUND or NO_PENDING_REVIEW.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/status:
    post:
      tags: [Clients]
      summary: Pause, reactivate, match or close a profile
      description: |
        Moves a profile between its live states: active to paused, matched or closed; paused or
        matched back to active or to closed. A profile waiting for review cannot be moved. Closed is
        final. Works for a member's own profile too, since it changes whether the profile is shown,
        not what it says.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChange' }
      responses:
        '200':
          description: The profile in its new state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409':
          {
            description: 'PROFILE_VERSION_CONFLICT or STATUS_CHANGE_NOT_ALLOWED.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/staff/clients/{profileId}/assignment:
    put:
      tags: [Clients]
      summary: Hand a profile to an agent
      description: Admins only. Changing who looks after a profile does not make a waiting request out of date.
      security:
        - bearerAuth: []
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
      responses:
        '200':
          description: The profile with its new agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404':
          {
            description: 'PROFILE_NOT_FOUND.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '422':
          {
            description: 'AGENT_NOT_AVAILABLE.',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /api/v1/admin/staff:
    get:
      tags: [Clients]
      summary: The staff clients can be handed to
      description: Admins only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admins and agents of this agency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The short-lived access token from sign-in or refresh (ES256). Keep it in memory only.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrfToken` from the last token response (43 URL-safe characters).
      schema: { type: string }

  schemas:
    Tenant:
      type: object
      required: [id, name, locale, content]
      properties:
        id: { type: string }
        name: { type: string }
        locale: { type: string, enum: [bn, en] }
        content: { $ref: '#/components/schemas/PublicConfig' }

    LocalizedText:
      type: object
      description: Text in one or both languages. A reader sees their own language, else the other.
      properties:
        bn: { type: string, maxLength: 2000 }
        en: { type: string, maxLength: 2000 }

    PublicConfig:
      type: object
      description: The agency's non-secret public settings. Every field is optional; unknown fields are ignored.
      properties:
        name:
          type: string
          description: Display name of the agency. Falls back to the agency's `name`.
        branding:
          type: object
          properties:
            logoUrl:
              type: string
              description: An `https://` URL or a path starting with `/`. Anything else is ignored.
            primaryColor:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              description: Main brand color as `#RRGGBB`. It reaches CSS, so nothing else is accepted.
        contact:
          type: object
          properties:
            phone: { type: string, maxLength: 40 }
            email: { type: string, maxLength: 200 }
        home:
          type: object
          description: Optional homepage copy that replaces the platform's default wording.
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            subtitle: { $ref: '#/components/schemas/LocalizedText' }
        about: { $ref: '#/components/schemas/LocalizedText' }
        branches:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Branch' }
        successStories:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/SuccessStory' }

    Branch:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        address: { $ref: '#/components/schemas/LocalizedText' }
        phone: { type: string, maxLength: 40 }
        mapUrl:
          type: string
          description: An `https://` link to the location on a map. Anything else is ignored.

    SuccessStory:
      type: object
      required: [names]
      description: Only stories the couple has agreed to publish belong here.
      properties:
        names: { $ref: '#/components/schemas/LocalizedText' }
        story: { $ref: '#/components/schemas/LocalizedText' }
        year: { type: integer, minimum: 1900, maximum: 2100 }

    Self:
      type: object
      required: [id, agencyId, role, displayName]
      properties:
        id: { type: string }
        agencyId: { type: string }
        role: { type: string, enum: [admin, agent, member] }
        displayName: { type: string }

    Tokens:
      type: object
      required: [accessToken, csrfToken, expiresIn]
      properties:
        accessToken: { type: string }
        csrfToken: { type: string }
        expiresIn: { type: integer, description: Seconds until the access token expires. }

    Gender:
      type: string
      enum: [male, female]
    MaritalStatus:
      type: string
      enum: [never_married, divorced, widowed]
    Complexion:
      type: string
      enum: [very_fair, fair, medium, olive, dark]
    BloodGroup:
      type: string
      enum: [a_pos, a_neg, b_pos, b_neg, ab_pos, ab_neg, o_pos, o_neg]
    Religion:
      type: string
      enum: [islam, hinduism, buddhism, christianity, other]
    Sect:
      type: string
      enum: [sunni, shia, other]
    EducationLevel:
      type: string
      description: Lowest to highest.
      enum: [ssc, hsc, diploma, bachelors, masters, phd]
    Degree:
      type: string
      enum: [ssc, hsc, diploma, bachelors, masters, phd, other]
    Occupation:
      type: string
      enum: [salaried, business, self_employed, student, homemaker, unemployed, other]
    IncomeBand:
      type: string
      description: Lowest to highest.
      enum: [below_20k, 20k_50k, 50k_100k, 100k_200k, above_200k]
    FamilyStatus:
      type: string
      description: Lowest to highest.
      enum: [lower, lower_middle, middle, upper_middle, upper]
    ReligiousPractice:
      type: string
      enum: [practicing, moderate, non_practicing]
    DietaryPreference:
      type: string
      enum: [no_restriction, halal_only, vegetarian, other]
    ManagedFor:
      type: string
      enum: [self, child, sibling, relative, other]
    District:
      type: string
      description: One of the 64 districts of Bangladesh.
      enum:
        [
          barguna,
          barishal,
          bhola,
          jhalokati,
          patuakhali,
          pirojpur,
          bandarban,
          brahmanbaria,
          chandpur,
          chattogram,
          coxs_bazar,
          cumilla,
          feni,
          khagrachhari,
          lakshmipur,
          noakhali,
          rangamati,
          dhaka,
          faridpur,
          gazipur,
          gopalganj,
          kishoreganj,
          madaripur,
          manikganj,
          munshiganj,
          narayanganj,
          narsingdi,
          rajbari,
          shariatpur,
          tangail,
          bagerhat,
          chuadanga,
          jashore,
          jhenaidah,
          khulna,
          kushtia,
          magura,
          meherpur,
          narail,
          satkhira,
          jamalpur,
          mymensingh,
          netrokona,
          sherpur,
          bogura,
          chapainawabganj,
          joypurhat,
          naogaon,
          natore,
          pabna,
          rajshahi,
          sirajganj,
          dinajpur,
          gaibandha,
          kurigram,
          lalmonirhat,
          nilphamari,
          panchagarh,
          rangpur,
          thakurgaon,
          habiganj,
          moulvibazar,
          sunamganj,
          sylhet,
        ]

    ProfileStatus:
      type: string
      enum: [draft, pending_review, rejected, active, paused, matched, closed]
    ProfileContent:
      type: object
      additionalProperties: false
      description: |
        Biodata. Every field may be omitted or null in a request (a draft can be partial); a
        response always contains every field. An empty string counts as null.
      properties:
        managedFor: { $ref: '#/components/schemas/ManagedFor' }
        fullName: { type: string, minLength: 1, maxLength: 100 }
        dateOfBirth:
          {
            type: [string, 'null'],
            format: date,
            description: 'YYYY-MM-DD. The member must be 18 to 100 years old.',
          }
        gender: { anyOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        maritalStatus: { anyOf: [{ $ref: '#/components/schemas/MaritalStatus' }, { type: 'null' }] }
        heightCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        weightKg: { type: [integer, 'null'], minimum: 20, maximum: 300 }
        complexionCode: { anyOf: [{ $ref: '#/components/schemas/Complexion' }, { type: 'null' }] }
        bloodGroup: { anyOf: [{ $ref: '#/components/schemas/BloodGroup' }, { type: 'null' }] }
        nationalityCode:
          { type: string, pattern: '^[A-Z]{2}$', description: ISO country code. BD when omitted. }
        religionCode: { anyOf: [{ $ref: '#/components/schemas/Religion' }, { type: 'null' }] }
        sectCode: { anyOf: [{ $ref: '#/components/schemas/Sect' }, { type: 'null' }] }
        currentCity: { type: [string, 'null'], maxLength: 100 }
        currentDistrictCode:
          { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        originDistrictCode: { anyOf: [{ $ref: '#/components/schemas/District' }, { type: 'null' }] }
        highestDegreeCode: { anyOf: [{ $ref: '#/components/schemas/Degree' }, { type: 'null' }] }
        institutionName: { type: [string, 'null'], maxLength: 150 }
        fieldOfStudy: { type: [string, 'null'], maxLength: 100 }
        graduationYear: { type: [integer, 'null'], minimum: 1950, maximum: 2100 }
        occupationCode: { anyOf: [{ $ref: '#/components/schemas/Occupation' }, { type: 'null' }] }
        jobTitle: { type: [string, 'null'], maxLength: 100 }
        employerName: { type: [string, 'null'], maxLength: 150 }
        monthlyIncomeBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        fatherName: { type: [string, 'null'], maxLength: 100 }
        fatherOccupation: { type: [string, 'null'], maxLength: 100 }
        motherName: { type: [string, 'null'], maxLength: 100 }
        motherOccupation: { type: [string, 'null'], maxLength: 100 }
        siblingCount: { type: [integer, 'null'], minimum: 0, maximum: 30 }
        familyStatusCode:
          { anyOf: [{ $ref: '#/components/schemas/FamilyStatus' }, { type: 'null' }] }
        religiousPracticeCode:
          { anyOf: [{ $ref: '#/components/schemas/ReligiousPractice' }, { type: 'null' }] }
        dietaryPreferenceCode:
          { anyOf: [{ $ref: '#/components/schemas/DietaryPreference' }, { type: 'null' }] }
        hobbies: { type: [string, 'null'], maxLength: 500 }
        aboutMe: { type: [string, 'null'], maxLength: 2000 }

    ContactDetails:
      type: object
      additionalProperties: false
      description: Private contact details. Never shown to other members.
      properties:
        contactName: { type: [string, 'null'], maxLength: 100 }
        contactRelationship: { type: [string, 'null'], maxLength: 50 }
        phone:
          {
            type: [string, 'null'],
            pattern: "^\\+[1-9][0-9]{7,14}$",
            description: 'E.164, for example +8801712345678.',
          }
        email: { type: [string, 'null'], format: email, maxLength: 200 }
        permanentAddress: { type: [string, 'null'], maxLength: 300 }

    PartnerPreferences:
      type: object
      additionalProperties: false
      description: Lists are empty when the member has no preference. Ranges may not be reversed.
      properties:
        ageMin: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        ageMax: { type: [integer, 'null'], minimum: 18, maximum: 100 }
        heightMinCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        heightMaxCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        religionCodes: { type: array, items: { $ref: '#/components/schemas/Religion' } }
        sectCodes: { type: array, items: { $ref: '#/components/schemas/Sect' } }
        maritalStatusCodes: { type: array, items: { $ref: '#/components/schemas/MaritalStatus' } }
        educationMinCode:
          { anyOf: [{ $ref: '#/components/schemas/EducationLevel' }, { type: 'null' }] }
        occupationCodes: { type: array, items: { $ref: '#/components/schemas/Occupation' } }
        districtCodes: { type: array, items: { $ref: '#/components/schemas/District' } }
        incomeMinBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        incomeMaxBandCode:
          { anyOf: [{ $ref: '#/components/schemas/IncomeBand' }, { type: 'null' }] }
        familyStatusMinCode:
          { anyOf: [{ $ref: '#/components/schemas/FamilyStatus' }, { type: 'null' }] }

    ProfileData:
      type: object
      additionalProperties: false
      properties:
        profile: { $ref: '#/components/schemas/ProfileContent' }
        contact: { $ref: '#/components/schemas/ContactDetails' }
        preferences: { $ref: '#/components/schemas/PartnerPreferences' }
    ProfileInput:
      type: object
      additionalProperties: false
      required: [profile]
      description: |
        The whole editable content, replacing what was there. Owner, agency, status, member code
        and the profile version can never be set by the client other than as the version last seen.
      properties:
        version:
          type: integer
          minimum: 1
          description: The profile version last seen. Omit only on the very first save.
        profile: { $ref: '#/components/schemas/ProfileContent' }
        contact: { $ref: '#/components/schemas/ContactDetails' }
        preferences: { $ref: '#/components/schemas/PartnerPreferences' }
    OwnProfile:
      type: object
      required: [id, memberCode, status, version, currentDivisionCode, createdAt, updatedAt, data]
      properties:
        id: { type: string, format: uuid }
        memberCode: { type: string, description: 'For example M0483921.' }
        status: { $ref: '#/components/schemas/ProfileStatus' }
        version: { type: integer, description: Rises on every change. }
        currentDivisionCode: { type: [string, 'null'], description: Worked out from the district. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/ProfileData' }
    ProposedChanges:
      type: object
      additionalProperties: false
      description: Only the fields that differ from the published profile.
      properties:
        profile: { type: object, additionalProperties: true }
        contact: { type: object, additionalProperties: true }
        preferences: { type: object, additionalProperties: true }
    ProfileReview:
      type: object
      required:
        [
          id,
          kind,
          status,
          baseProfileVersion,
          proposedChanges,
          reviewerNotes,
          reviewedAt,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [initial_submission, field_update] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        baseProfileVersion: { type: [integer, 'null'] }
        proposedChanges:
          description: For an initial submission, the whole content; for a field update, only what differs.
          anyOf:
            [
              { $ref: '#/components/schemas/ProposedChanges' },
              { $ref: '#/components/schemas/ProfileData' },
              { type: 'null' },
            ]
        reviewerNotes: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    OwnProfileState:
      type: object
      required: [profile, pendingReview, lastDecision]
      properties:
        profile: { anyOf: [{ $ref: '#/components/schemas/OwnProfile' }, { type: 'null' }] }
        pendingReview: { anyOf: [{ $ref: '#/components/schemas/ProfileReview' }, { type: 'null' }] }
        lastDecision:
          description: The most recent approval or rejection, including the reviewer's note.
          anyOf: [{ $ref: '#/components/schemas/ProfileReview' }, { type: 'null' }]
    ProfileSubmit:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }

    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: A short machine-readable outcome, such as `verification_sent` or `verified`.
    AuthMethods:
      type: object
      required: [password, google, phone]
      properties:
        password: { type: boolean }
        google: { type: boolean }
        phone: { type: boolean }
    ReauthStartInput:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale: { type: string, enum: [bn, en], description: The language of the text message. }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [code, password]
      properties:
        code: { type: string, description: The six digits sent to the account's own phone. }
        password: { type: string, minLength: 10, maxLength: 128 }
    AddEmailStartInput:
      type: object
      additionalProperties: false
      required: [email, code, locale]
      properties:
        email: { type: string, format: email }
        code: { type: string, description: The six digits sent to the account's own phone. }
        locale: { type: string, enum: [bn, en], description: The language of the email and of the page its link opens. }
    PhoneStartInput:
      type: object
      additionalProperties: false
      required: [phone, locale]
      properties:
        phone:
          type: string
          description: A Bangladeshi mobile number (01712345678, 8801712345678, +8801712345678) or any number with its + and country code. Bengali digits are accepted.
        locale: { type: string, enum: [bn, en], description: The language of the text message. }
    PhoneVerifyInput:
      type: object
      additionalProperties: false
      required: [phone, code, locale]
      properties:
        phone: { type: string }
        code: { type: string, description: The six digits (Bengali digits are accepted). }
        locale: { type: string, enum: [bn, en], description: The language of the pages that follow. }
    PhoneAttachInput:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string }
    CodeSent:
      type: object
      required: [status, resendAfter, expiresIn]
      properties:
        status: { type: string, enum: [code_sent] }
        resendAfter: { type: integer, description: Seconds until another code can be asked for. }
        expiresIn: { type: integer, description: Seconds the code works. }
    PendingPhoneSignup:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: The number the code proved, in E.164 form. }
    PhoneSignupInput:
      type: object
      additionalProperties: false
      required: [displayName, password]
      description: |
        `displayName` and `password` are required. The password follows the same rules as any new
        password (10 to 128 characters, not a very common one; problems come back as `tooShort`,
        `tooLong`, `tooWeak`) and may not be the phone number itself (`sameAsPhone`). It is stored
        hashed with the account, so the member can later log in with the number and the password
        and no text message. `acceptTerms` and `acceptPrivacy` must be true, and `confirmAuthority`
        when `onBehalfOfOther` is true; problems come back as the field code `required`. The number
        comes from the proof, never from the request.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 10, maxLength: 128 }
        acceptTerms: { type: boolean, default: false }
        acceptPrivacy: { type: boolean, default: false }
        onBehalfOfOther: { type: boolean, default: false }
        confirmAuthority: { type: boolean, default: false }
    SignInMethods:
      type: object
      required: [email, emailVerified, phone, hasPassword, google]
      properties:
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        phone: { type: [string, 'null'], description: Partly hidden. }
        hasPassword: { type: boolean }
        google: { type: boolean }
    AuthorizationUrl:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string }
    PendingGoogleLink:
      type: object
      required: [email]
      properties:
        email: { type: string }
    PendingGoogleSignup:
      type: object
      required: [email, name]
      properties:
        email: { type: string }
        name: { type: string }
    GoogleSignupInput:
      type: object
      additionalProperties: false
      description: |
        `acceptTerms` and `acceptPrivacy` must be true, and `confirmAuthority` when
        `onBehalfOfOther` is true; problems come back as the field code `required`.
      properties:
        acceptTerms: { type: boolean, default: false }
        acceptPrivacy: { type: boolean, default: false }
        onBehalfOfOther: { type: boolean, default: false }
        confirmAuthority: { type: boolean, default: false }
    GoogleLinkInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
    GoogleStartInput:
      type: object
      additionalProperties: false
      required: [intent, locale]
      description: |
        Starting a sign-in with Google. Registering needs `acceptTerms` and `acceptPrivacy` to be
        true, and `confirmAuthority` when `onBehalfOfOther` is true; their problems come back as the
        field code `required`. The name and the email come from Google, never from the request.
      properties:
        intent: { type: string, enum: [login, register] }
        locale: { type: string, enum: [bn, en], description: The language the person is reading. }
        acceptTerms: { type: boolean, default: false }
        acceptPrivacy: { type: boolean, default: false }
        onBehalfOfOther: { type: boolean, default: false }
        confirmAuthority: { type: boolean, default: false }
    LinkToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The one-time secret in the emailed link.
    LoginInput:
      type: object
      additionalProperties: false
      required: [password]
      description: Exactly one of `email` and `phone`.
      properties:
        email: { type: string, maxLength: 254, description: Trimmed and lower-cased by the server. }
        phone: { type: string, maxLength: 40, description: A Bangladeshi mobile number or any number with its + and country code. Bengali digits are accepted. }
        password: { type: string, minLength: 1, maxLength: 256 }
    ForgotPasswordInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        password:
          type: string
          description: |
            10 to 128 characters (counted as a person sees them, so Bengali is not penalised), not a
            very common password, not made of fewer than 5 different characters. Problems come back
            as field codes `tooShort`, `tooLong` and `tooWeak`.
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password, displayName, locale, acceptTerms, acceptPrivacy]
      description: |
        What a new member types to register. A role can never be sent; registration only creates a
        member. The email is proven by the emailed link before the account exists. Field problems
        come back as codes: `required`, `tooLong`, `invalidEmail`, `tooShort`, `tooWeak`,
        `sameAsEmail` (the password is the email or its part before the @), `invalidOption`.
      properties:
        email: { type: string, maxLength: 254, description: Trimmed and lower-cased by the server. }
        password:
          type: string
          description: Same rules as `ResetPasswordInput.password`, and not the email.
        displayName:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: The account holder's own name.,
          }
        locale: { type: string, enum: [bn, en], description: The language the person is reading. }
        acceptTerms: { type: boolean, enum: [true], description: Must be true. }
        acceptPrivacy: { type: boolean, enum: [true], description: Must be true. }
        onBehalfOfOther:
          {
            type: boolean,
            default: false,
            description: Registering for a son,
            daughter,
            sibling or relative.,
          }
        confirmAuthority:
          {
            type: boolean,
            default: false,
            description: Required when registering for someone else.,
          }
    PhotoState:
      type: string
      enum: [waiting, approved, rejected]
      description: Waiting for a reviewer, approved (shown to others) or rejected.
    Photo:
      type: object
      required: [id, state, isPrimary, createdAt, reviewerNotes]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PhotoState' }
        isPrimary:
          { type: boolean, description: The photo shown first. Only an approved photo can be it. }
        createdAt: { type: string, format: date-time }
        reviewerNotes:
          { type: [string, 'null'], description: The reviewer's note when the photo was rejected. }
    PhotoList:
      type: object
      required: [photos, limit]
      properties:
        photos:
          type: array
          description: In the order the member uploaded them. Removed photos are not listed.
          items: { $ref: '#/components/schemas/Photo' }
        limit: { type: integer, description: How many photos a member may have at once. }

    StaffRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    QueueKind:
      type: string
      enum: [initial_submission, field_update, photo_add]
      description: A new profile, a change to a published profile, or a new photo.
    QueueStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    ServiceMode:
      type: string
      enum: [self_service, assisted]
      description: A member who runs their own profile, or a client whose profile the agency runs.
    QueueItem:
      type: object
      required: [id, kind, status, createdAt, profile, submittedBy, photoId]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/QueueKind' }
        status: { $ref: '#/components/schemas/QueueStatus' }
        createdAt: { type: string, format: date-time }
        profile:
          type: object
          required: [id, memberCode, fullName, serviceMode, assignedAgentId]
          properties:
            id: { type: string, format: uuid }
            memberCode: { type: string }
            fullName: { type: string }
            serviceMode: { $ref: '#/components/schemas/ServiceMode' }
            assignedAgentId: { type: [string, 'null'], format: uuid }
        submittedBy: { $ref: '#/components/schemas/StaffRef' }
        photoId: { type: [string, 'null'], format: uuid, description: Set for a photo request. }
    QueuePage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
        next:
          {
            type: [string, 'null'],
            description: Pass as `after` for the next page. Null on the last page.,
          }
    FieldChange:
      type: object
      required: [path, before, after]
      properties:
        path:
          {
            type: string,
            description: For example profile.heightCm. Fields are named as in ProfileInput.,
          }
        before:
          {
            description: The published value,
            or null when nothing was published or the field was empty.,
          }
        after: { description: The proposed value. }
    ReviewDetail:
      allOf:
        - { $ref: '#/components/schemas/QueueItem' }
        - type: object
          required:
            [
              baseProfileVersion,
              reviewerNotes,
              reviewedAt,
              decidedBy,
              profileStatus,
              profileVersion,
              changes,
              stale,
              canDecide,
              blockedBy,
            ]
          properties:
            baseProfileVersion:
              {
                type: [integer, 'null'],
                description: The profile version the request was made against.,
              }
            reviewerNotes: { type: [string, 'null'] }
            reviewedAt: { type: [string, 'null'], format: date-time }
            decidedBy: { anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }] }
            profileStatus: { type: string }
            profileVersion: { type: integer, description: The version to send back when approving. }
            changes:
              type: array
              description: What the reviewer is asked to look at. Empty for a photo.
              items: { $ref: '#/components/schemas/FieldChange' }
            stale:
              {
                type: boolean,
                description: The profile changed after the request was made,
                so it can no longer be approved.,
              }
            canDecide: { type: boolean }
            blockedBy:
              description: Why it cannot be decided now.
              anyOf:
                - { type: string, enum: [decided, cancelled, stale, own_submission] }
                - { type: 'null' }
    ApproveInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
        profileVersion:
          {
            type: integer,
            minimum: 1,
            description: The version the reviewer looked at. If the profile moved on,
            the approval is refused.,
          }
    RejectInput:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 1000, description: Why. The member sees it. }
    QueueSummary:
      type: object
      required: [pending]
      properties:
        pending: { type: integer }
    ClientListItem:
      type: object
      required:
        [
          id,
          memberCode,
          fullName,
          status,
          serviceMode,
          version,
          updatedAt,
          assignedAgent,
          districtCode,
          hasPendingReview,
        ]
      properties:
        id: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        status: { $ref: '#/components/schemas/ProfileStatus' }
        serviceMode: { $ref: '#/components/schemas/ServiceMode' }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        assignedAgent: { anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }] }
        districtCode: { type: [string, 'null'] }
        hasPendingReview: { type: boolean }
    ClientPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClientListItem' }
        next: { type: [string, 'null'] }
    ClientMeta:
      type: object
      required: [serviceMode, assignedAgent, owner]
      properties:
        serviceMode: { $ref: '#/components/schemas/ServiceMode' }
        assignedAgent: { anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }] }
        owner:
          {
            anyOf: [{ $ref: '#/components/schemas/StaffRef' }, { type: 'null' }],
            description: The member who runs a self-service profile. Null for an assisted client.,
          }
    ClientDetail:
      allOf:
        - { $ref: '#/components/schemas/OwnProfileState' }
        - type: object
          required: [client]
          properties:
            client: { $ref: '#/components/schemas/ClientMeta' }
    ClientInput:
      allOf:
        - { $ref: '#/components/schemas/ProfileInput' }
        - type: object
          properties:
            assignedAgentId:
              {
                type: [string, 'null'],
                format: uuid,
                description: "On creation, admins only: who looks after the client. An agent's new client is always theirs.",
              }
    StatusChange:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [active, paused, matched, closed] }
        version: { type: integer, minimum: 1, description: The profile version last seen. }
    AssignmentInput:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId:
          {
            type: [string, 'null'],
            format: uuid,
            description: An active admin or agent,
            or null for nobody.,
          }
    StaffMember:
      type: object
      required: [id, displayName, role, status]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [admin, agent] }
        status: { type: string, enum: [invited, active, disabled] }
    StaffList:
      type: object
      required: [staff]
      properties:
        staff:
          type: array
          items: { $ref: '#/components/schemas/StaffMember' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, requestId]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code. Known codes: HOST_INVALID, TENANT_NOT_FOUND,
                BEARER_TOKEN_REQUIRED, INVALID_ACCESS_TOKEN, SESSION_INVALID, SESSION_EXPIRED,
                ACCOUNT_NOT_ACTIVE, ROLE_FORBIDDEN, ORIGIN_INVALID, CSRF_INVALID,
                REFRESH_UNAVAILABLE,
                INVALID_REQUEST, RATE_LIMITED, REQUEST_REJECTED, INTERNAL_ERROR, and for My profile:
                PROFILE_NOT_FOUND, PROFILE_VERSION_CONFLICT, PROFILE_LOCKED,
                PROFILE_EDIT_REQUIRES_REVIEW, PROFILE_STATE_INVALID, PROFILE_INCOMPLETE,
                NO_PENDING_REVIEW, NO_CHANGES, MEMBER_CODE_UNAVAILABLE, and for photos:
                PHOTO_NOT_FOUND, PHOTO_LIMIT_REACHED, PHOTO_NOT_APPROVED, PHOTO_INVALID,
                PHOTO_TYPE_UNSUPPORTED, PHOTO_TOO_SMALL, PAYLOAD_TOO_LARGE,
                UNSUPPORTED_MEDIA_TYPE, and for signing in and email links: INVALID_CREDENTIALS,
                TOO_MANY_ATTEMPTS (with details.retryAfter, seconds), EMAIL_RATE_LIMITED (with
                details.retryAfter, seconds), LINK_INVALID_OR_EXPIRED, and
                for Google: GOOGLE_NOT_CONFIGURED, GOOGLE_UNAVAILABLE, GOOGLE_AUTH_FAILED,
                GOOGLE_EMAIL_UNVERIFIED (Google has not confirmed the email), ACCOUNT_HAS_NO_PASSWORD (the account has no
                password to approve a link with), GOOGLE_ALREADY_LINKED, GOOGLE_RETRY, OAUTH_CHALLENGE_EXPIRED,
                OAUTH_CONTEXT_MISMATCH, and
                for adding an email: EMAIL_ALREADY_SET, PHONE_REQUIRED, EMAIL_IN_USE, and
                for phone codes: PHONE_NOT_CONFIGURED, CODE_RATE_LIMITED (with details.retryAfter,
                seconds), SMS_UNAVAILABLE, CODE_INVALID, CODE_EXPIRED, PHONE_RETRY, PHONE_IN_USE, and
                for staff: REVIEW_NOT_FOUND, REVIEW_ALREADY_DECIDED, REVIEW_CANCELLED,
                REVIEW_OUT_OF_DATE, REVIEW_OWN_SUBMISSION, PROFILE_SELF_SERVICE,
                STATUS_CHANGE_NOT_ALLOWED, AGENT_NOT_AVAILABLE.
            details:
              type: object
              description: |
                Present on INVALID_REQUEST and PROFILE_INCOMPLETE. Each problem names a field by its
                dotted path (for example `profile.dateOfBirth`) and a stable code the client
                translates: required, tooLong, tooShort, tooWeak, sameAsEmail, invalid, invalidOption,
                invalidDate, underAge, tooOld, outOfRange, invalidPhone, invalidEmail, rangeOrder. Values are never echoed back.
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [path, code]
                    properties:
                      path: { type: string }
                      code: { type: string }
            requestId: { type: string, description: Quote this when reporting a problem. }

  responses:
    Error400:
      description: Invalid host or request (HOST_INVALID, INVALID_REQUEST).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: Not authenticated or session invalid. Sends `WWW-Authenticate Bearer`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: Forbidden (ROLE_FORBIDDEN, ACCOUNT_NOT_ACTIVE, ORIGIN_INVALID, CSRF_INVALID).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TenantNotFound:
      description: The hostname is not a provisioned, active agency (TENANT_NOT_FOUND).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests (RATE_LIMITED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
