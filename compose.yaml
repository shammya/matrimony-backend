# Local infrastructure only. API/worker run with npm scripts.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: matrimony
      POSTGRES_PASSWORD: local_admin_password
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matrimony"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
volumes:
  postgres-data:
  redis-data:
  mongo-data:
